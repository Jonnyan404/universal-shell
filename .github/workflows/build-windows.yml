name: Build Windows (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: false
        default: '0.1.0'
      arch:
        description: '架构'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x86_64
          - arm64
      deploy:
        description: '构建后部署到 release tag v<version> (确认已存在 release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      overwrite_assets:
        description: '覆盖重名资产 (否则同名资产会跳过)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (windows-${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            os: windows-latest
          - label: arm64
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri frontend deps
        run: |
          cd app-tauri
          npm install
        shell: bash

      - name: Install WiX Toolset (Windows .msi)
        run: |
          # tauri 打 .msi 需要 candle/light（WiX v3，经 PATH 暴露）；用 chocolatey 装
          choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          V="${{ github.event.inputs.version }}"
          V=$(echo "$V" | sed 's/^v//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Filter arch
        if: github.event.inputs.arch != 'all'
        run: |
          if [ "${{ github.event.inputs.arch }}" != "${{ matrix.label }}" ]; then
            echo "skip=1" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Build tauri bundle
        if: env.skip != '1'
        env:
          # 注入版本：App 内版本/自更新检查与本次一致
          UNIVERSAL_SHELL_VERSION: ${{ steps.version.outputs.value }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          # nsis+msi：NSIS 由 tauri bundler 自动下载，msi 用前面装好的 WiX
          # （不加 --target：arm64 runner 原生即 aarch64-pc-windows-msvc，产物在 target/release/bundle）
          (cd app-tauri && npx tauri build --bundles nsis,msi \
            --config "{\"version\":\"$VERSION\"}")
          mkdir -p dist/bundle
          find target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' \) \
            -exec sh -c '
              b=$(basename "$1"); b=${b#universal-shell_}
              cp "$1" "dist/bundle/universal-shell-tauri-$b"
            ' _ {} \;
        shell: bash

      - name: Build CLI (us-web)
        if: env.skip != '1'
        run: |
          if [ "${{ matrix.label }}" = "arm64" ]; then
            TGT="aarch64-pc-windows-msvc"
          else
            TGT="x86_64-pc-windows-msvc"
          fi
          cargo build --release --target "$TGT" -p app-cli
        shell: bash

      - name: Package CLI (us-web)
        if: env.skip != '1'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          CLI="dist/cli/windows"
          if [ "${{ matrix.label }}" = "arm64" ]; then
            TGT="aarch64-pc-windows-msvc"
          else
            TGT="x86_64-pc-windows-msvc"
          fi
          mkdir -p "$CLI"
          # 资产名对齐 release.yml：带 windows- 平台前缀，保证 release 部署时可覆盖同名资产
          cp "target/$TGT/release/us-web.exe" "$CLI/universal-shell-cli-$VERSION-windows-${{ matrix.label }}.exe"
        shell: bash

      - name: SHA256
        if: env.skip != '1'
        run: |
          OUT="dist/sha256-${{ matrix.label }}.txt"
          : > "$OUT"
          find dist -type f -not -name 'sha256-*.txt' -print0 \
            | while IFS= read -r -d '' f; do
                echo "$(sha256sum "$f" | awk '{print $1}')  ${f#dist/}" >> "$OUT"
              done
        shell: bash

      - name: Inspect artifacts
        if: env.skip != '1'
        run: |
          find dist -maxdepth 3 -type f
        shell: bash

      # 部署时安装包直接从 runner 传到 Release，不经 artifact（私有库配额很小）
      - name: Publish assets to release
        if: env.skip != '1' && github.event.inputs.deploy == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          # overwrite_files=true 时先删除同名旧资产再上传，实现"追加/覆盖"
          overwrite_files: ${{ github.event.inputs.overwrite_assets != 'false' }}
          files: |
            dist/cli/**/*
            dist/bundle/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 仅「构建不部署」时需要 artifact，供 run 页面下载；保留 1 天
      - name: Upload artifacts
        if: env.skip != '1' && github.event.inputs.deploy != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: universal-shell-windows-${{ matrix.label }}
          path: dist/
          retention-days: 1

  checksums:
    name: Merge sha256.txt
    needs: build
    runs-on: ubuntu-latest
    # 手动触发且勾选了 deploy 时才需要
    if: github.event.inputs.deploy == 'true'
    steps:
      - name: Assemble sha256.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          TAG="v${V#v}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.digest != null and .digest != "" and .name != "sha256.txt")
                   | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            | sort -k2 > sha256.txt || true

          if [ ! -s sha256.txt ]; then
            echo "::warning::release assets 没有 digest，回退为下载后本地计算"
            mkdir -p dl
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --clobber
            ( cd dl && sha256sum * | sort -k2 ) > sha256.txt
          fi

          echo "== sha256.txt =="
          cat sha256.txt
          gh release upload "$TAG" sha256.txt --repo "$GITHUB_REPOSITORY" --clobber
