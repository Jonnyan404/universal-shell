name: Release (universal-shell Rust)

on:
  # 创建/发布 GitHub Release 时自动构建并上传到该 Release
  release:
    types: [published]
  # 手动触发（不发布，仅构建产物供预览/测试）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macos-x86_64
            os: macos-15
          - label: macos-arm64
            os: macos-15-arm64
          - label: windows-x86_64
            os: windows-latest
          - label: windows-arm64
            # 官方原生 Windows ARM64 runner（Ampere Altra，非仿真）
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri frontend deps
        run: |
          cd app-tauri
          npm install
        shell: bash

      - name: Install Linux egui runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libxkbcommon0 libxcb1 libegl1
        shell: bash

      - name: Build + package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          ./scripts/build-release.sh "$VERSION"
        shell: bash

      - name: Inspect artifacts
        run: |
          find dist -maxdepth 3 -type f
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-shell-${{ matrix.label }}
          path: dist/
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: universal-shell-*
          path: dist/
          merge-multiple: true

      - name: Restore execute permissions
        # upload-artifact 的 zip 会剥掉 +x（全部变 644/755）；恢复可执行产物的执行位，
        # 保证 Release 里 Linux/macOS 二进制 / .app 内二进制可直接运行
        run: |
          find dist -type f \
            \( -name 'universal-shell-egui-*' \
               -o -path '*/Contents/MacOS/*' \
               -o -path '*/bin/*' \) \
            -exec chmod +x {} +
        shell: bash

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
