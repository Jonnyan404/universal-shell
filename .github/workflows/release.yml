name: Release (universal-shell Rust)

on:
  # 创建/发布 GitHub Release 时自动构建并上传到该 Release
  release:
    types: [published]
  # 手动触发：可直接构建产物，也可选择部署到 release（追加/覆盖资产）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: true
        default: '0.1.0'
      deploy:
        description: '构建后部署到 release tag v<version> (确认已存在 release)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      overwrite_assets:
        description: '覆盖重名资产 (否则同名资产会跳过)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macOS-x86_64
            # 标准 macOS runner 默认即为 arm64（Apple Silicon）；x64 需显式 -intel
            os: macos-15-intel
          - label: macOS-arm64
            os: macos-15
          - label: windows-x86_64
            os: windows-latest
          - label: windows-arm64
            # 官方原生 Windows ARM64 runner（Ampere Altra，非仿真）
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri frontend deps
        run: |
          cd app-tauri
          npm install
        shell: bash

      - name: Install Linux egui runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libxkbcommon0 libxcb1 libegl1 \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libfontconfig-dev \
            libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev xdg-utils
        shell: bash

      - name: Install WiX Toolset (Windows .msi)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix --locked
          # cargo-wix 需要 candle/light（WiX v3，经 PATH 暴露）；用 chocolatey 装
          choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${{ github.event.release.tag_name }}"
          fi
          V=$(echo "$V" | sed 's/^v//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
        shell: bash

      # ---- egui：各平台原生自产自的安装包（不复用本地 build-release.sh，其专为单机多目标设计）----
      - name: Build egui binary
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            if echo "${{ matrix.label }}" | grep -q arm64; then
              TGT="aarch64-pc-windows-msvc"
            else
              TGT="x86_64-pc-windows-msvc"
            fi
            cargo build --release --target "$TGT" -p app-egui
          else
            cargo build --release -p app-egui
          fi
        shell: bash

      - name: Package egui (Windows .exe + .msi)
        if: runner.os == 'Windows'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          APP="universal-shell-egui"
          EGUI="dist/egui/windows"
          if echo "${{ matrix.label }}" | grep -q arm64; then
            TGT="aarch64-pc-windows-msvc"
          else
            TGT="x86_64-pc-windows-msvc"
          fi
          mkdir -p "$EGUI"
          cp "target/$TGT/release/$APP.exe" "$EGUI/$APP-$VERSION-$TGT.exe"
          # choco 装的 WiX v3 在安装时才加 PATH，当前 bash 会话拿不到；
          # 直接定位 bin 目录(含 candle/light)并通过 --bin-path 传给 cargo-wix
          # (用数组避免路径中的空格被拆成多个参数)
          WIX_ARGS=()
          if command -v candle >/dev/null 2>&1; then
            WIX_ARGS=(--bin-path "$(dirname "$(command -v candle)")")
          else
            WIXBIN="$(ls -d "/c/Program Files"*/WiX\ Toolset\ v*/bin 2>/dev/null | head -1)"
            if [ -n "$WIXBIN" ]; then
              WIX_ARGS=(--bin-path "$WIXBIN")
            fi
          fi
          (cd app-egui && cargo wix --nocapture --no-build -p app-egui \
            --target "$TGT" --target-bin-dir "$GITHUB_WORKSPACE/target/$TGT/release" \
            "${WIX_ARGS[@]}" \
            -o "../$EGUI/$APP-$VERSION-$TGT.msi")
        shell: bash

      - name: Package egui (macOS .app + .dmg)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          # egui 是各 runner 原生架构编译，非通用二进制；须带架构区分文件名，
          # 否则 arm64/x86_64 两个 job 产出同名 dmg 互相覆盖，只留一份且被误标为"通用"
          if echo "${{ matrix.label }}" | grep -q arm64; then
            ARCH="aarch64"
          else
            ARCH="x86_64"
          fi
          cd "$GITHUB_WORKSPACE"
          APP="universal-shell-egui"
          EGUI="dist/egui/macos"
          APPNAME="$EGUI/$APP.app"
          mkdir -p "$APPNAME/Contents/MacOS" "$APPNAME/Contents/Resources"
          cp "target/release/$APP" "$APPNAME/Contents/MacOS/$APP"
          cp "assets/icons/egui-bundle/icon.icns" "$APPNAME/Contents/Resources/icon.icns"
          cat > "$APPNAME/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Universal Shell</string>
            <key>CFBundleDisplayName</key><string>Universal Shell</string>
            <key>CFBundleIdentifier</key><string>com.universal.shell.egui</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          chmod +x "$APPNAME/Contents/MacOS/$APP"
          STAGE="$EGUI/.dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$APPNAME" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Universal Shell $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "$EGUI/$APP-$VERSION-$ARCH.dmg" >/dev/null
          rm -rf "$STAGE"
          # dist/**/* 会上传整个 dist，删掉 .app 目录避免其内部文件
          # (Info.plist / icon.icns / 裸二进制)当独立资产混进 Release
          rm -rf "$APPNAME"
        shell: bash

      - name: Package egui (Linux binary)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          APP="universal-shell-egui"
          EGUI="dist/egui/linux"
          mkdir -p "$EGUI"
          cp "target/release/$APP" "$EGUI/$APP-$VERSION-${{ matrix.label }}"
          chmod +x "$EGUI/$APP-$VERSION-${{ matrix.label }}"
        shell: bash

      # ---- tauri：仅在 Linux/macOS 由 tauri build 原生产出 ----
      # 只把最终可分发的安装包拷入 dist/bundle，丢弃 tauri 中间目录
      # （AppImage/deb 的展开内容、control、*.so、gschemas、desktop 等大量无关文件），
      # 避免它们混进 Release / sha256.txt。按平台限定 bundle 目标，防止 Linux 上产出 dmg 等跨平台产物。
      - name: Build tauri bundle (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            BUNDLES="app,dmg"
          else
            BUNDLES="deb,rpm,appimage"
          fi
          # 用解析出的 VERSION 覆盖 tauri.conf.json 里写死的 version，保证安装包版本与 release tag 一致
          (cd app-tauri && npx tauri build --bundles "$BUNDLES" \
            --config "{\"version\":\"$VERSION\"}")
          mkdir -p dist/bundle
          # 仅保留最终安装包，丢开 tauri 的中间/展开文件
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} dist/bundle/ \;
        shell: bash

      - name: SHA256
        run: |
          : > dist/sha256.txt
          if command -v sha256sum >/dev/null; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          find dist -type f -not -name sha256.txt -print0 \
            | while IFS= read -r -d '' f; do
                $HASH "$f" | awk -v p="${f#dist/}" '{print $1"  "p}' >> dist/sha256.txt
              done
        shell: bash

      - name: Inspect artifacts
        run: |
          find dist -maxdepth 3 -type f
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-shell-${{ matrix.label }}
          path: dist/
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # release 事件，或手动触发且勾选了 deploy 时才部署
    if: >-
      ${{
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 复用 version 输入，拼出带 v 前缀的 tag：v0.1.0
            echo "value=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: universal-shell-*
          path: dist/
          merge-multiple: true

      - name: Restore execute permissions
        # upload-artifact 的 zip 会剥掉 +x（全部变 644/755）；恢复可执行产物的执行位，
        # 保证 Release 里 Linux/macOS 二进制 / .app 内二进制可直接运行
        run: |
          find dist -type f \
            \( -name 'universal-shell-egui-*' \
               -o -path '*/Contents/MacOS/*' \
               -o -path '*/bin/*' \) \
            -exec chmod +x {} +
        shell: bash

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          # overwrite=true 时先删除同名旧资产再上传，实现"追加/覆盖"
          overwrite: ${{ github.event.inputs.overwrite_assets != 'false' }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
