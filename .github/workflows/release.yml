name: Release (universal-shell Rust)

on:
  # 创建/发布 GitHub Release 时自动构建并上传到该 Release
  release:
    types: [published]
  # 手动触发：可直接构建产物，也可选择部署到 release（追加/覆盖资产）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: true
        default: '0.2.0'
      deploy:
        description: '构建后部署到 release tag v<version> (确认已存在 release)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      overwrite_assets:
        description: '覆盖重名资产 (否则同名资产会跳过)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macOS-x86_64
            # 标准 macOS runner 默认即为 arm64（Apple Silicon）；x64 需显式 -intel
            os: macos-15-intel
          - label: macOS-arm64
            os: macos-15
          - label: windows-x86_64
            os: windows-latest
          - label: windows-arm64
            # 官方原生 Windows ARM64 runner（Ampere Altra，非仿真）
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri frontend deps
        run: |
          cd app-tauri
          npm install
        shell: bash

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libegl1 \
            libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev xdg-utils
        shell: bash

      - name: Install WiX Toolset (Windows .msi)
        if: runner.os == 'Windows'
        run: |
          # tauri 打 .msi 需要 candle/light（WiX v3，经 PATH 暴露）；用 chocolatey 装
          choco install wixtoolset -y --no-progress
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            V="${V#v}"
            TAG="v$V"
          else
            # release 事件：沿用 release 的 tag 原文，避免「tag 不带 v」时拼错资产目标
            TAG="${{ github.event.release.tag_name }}"
            V="${TAG#v}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      # ---- cli：无窗口 headless 服务端 us-web（树莓派/NAS/无桌面环境），随各平台打包 ----
      - name: Build CLI (us-web)
        env:
          UNIVERSAL_SHELL_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            TGT=$(echo "${{ matrix.label }}" | grep -q arm64 && echo aarch64-pc-windows-msvc || echo x86_64-pc-windows-msvc)
            cargo build --release --target "$TGT" -p app-cli
          else
            cargo build --release -p app-cli
          fi
        shell: bash

      - name: Package CLI (universal-shell-cli)
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          CLI="dist/cli/${{ matrix.label }}"
          mkdir -p "$CLI"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TGT=$(echo "${{ matrix.label }}" | grep -q arm64 && echo aarch64-pc-windows-msvc || echo x86_64-pc-windows-msvc)
            cp "target/$TGT/release/us-web.exe" "$CLI/universal-shell-cli-$VERSION-${{ matrix.label }}.exe"
          else
            cp "target/release/us-web" "$CLI/universal-shell-cli-$VERSION-${{ matrix.label }}"
            chmod +x "$CLI/universal-shell-cli-$VERSION-${{ matrix.label }}"
          fi
        shell: bash

      # ---- tauri：各平台原生产出自带安装包（Windows 用 nsis+msi，WiX 由上一步装好；NSIS 由 tauri bundler 自动下载）----
      # 只把最终可分发的安装包拷入 dist/bundle，丢弃 tauri 中间目录
      # （AppImage/deb 的展开内容、control、*.so、gschemas、desktop 等大量无关文件），
      # 避免它们混进 Release / sha256.txt。按平台限定 bundle 目标，防止 Linux 上产出 dmg 等跨平台产物。
      - name: Build tauri bundle
        env:
          # 同上：tauri 侧 Rust 版本与 release tag 一致
          UNIVERSAL_SHELL_VERSION: ${{ steps.version.outputs.value }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          case "$RUNNER_OS" in
            macOS)   BUNDLES="app,dmg" ;;
            Linux)   BUNDLES="deb,rpm,appimage" ;;
            Windows) BUNDLES="nsis,msi" ;;
          esac
          # 用解析出的 VERSION 覆盖 tauri.conf.json 里写死的 version，保证安装包版本与 release tag 一致
          (cd app-tauri && npx tauri build --bundles "$BUNDLES" \
            --config "{\"version\":\"$VERSION\"}")
          mkdir -p dist/bundle
          # 仅保留最终安装包，丢开 tauri 的中间/展开文件；
          # 统一改名为 universal-shell-tauri-<原名>，与 universal-shell-cli-* 前缀保持一致。
          # tauri 原名带 productName "universal-shell" 前缀，但分隔符因包类型而异：
          # AppImage/deb/dmg 是下划线（universal-shell_0.1.8_arch.xxx），
          # rpm 是连字符（universal-shell-0.1.8-1.arch.rpm），两种都要剥掉，
          # 否则 rpm 会拼成 universal-shell-tauri-universal-shell-… 重复前缀。
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.msi' -o -name '*.exe' \) \
            -exec sh -c '
              b=$(basename "$1"); b=${b#universal-shell_}
              case "$b" in universal-shell-*) b=${b#universal-shell-};; esac
              cp "$1" "dist/bundle/universal-shell-tauri-$b"
            ' _ {} \;
        shell: bash

      - name: SHA256 (per platform)
        # 仅用于「预览构建」（无 Release 可传）时的 artifact；发布走 Release 时
        # sha256.txt 由 checksums job 从资产 digest 统一汇总，不需要各 job 各传一份。
        run: |
          OUT="dist/sha256-${{ matrix.label }}.txt"
          : > "$OUT"
          if command -v sha256sum >/dev/null; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          find dist -type f -not -name 'sha256-*.txt' -print0 \
            | while IFS= read -r -d '' f; do
                $HASH "$f" | awk -v p="${f#dist/}" '{print $1"  "p}' >> "$OUT"
              done
        shell: bash

      - name: Inspect artifacts
        run: |
          find dist -maxdepth 3 -type f
        shell: bash

      # 发布路径：安装包直接从 runner 传到 Release，不经 artifact。
      # 私有库的 artifact 配额很小（单次全平台约 270 MB），转存一次就把额度吃掉大半。
      - name: Publish assets to release
        if: ${{ github.event_name == 'release' || github.event.inputs.deploy == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # overwrite=true 时先删同名旧资产再上传，实现「重跑覆盖」
          overwrite: ${{ github.event.inputs.overwrite_assets != 'false' }}
          # 不传 dist/sha256-*.txt：汇总版 sha256.txt 由 checksums job 生成
          files: |
            dist/cli/**/*
            dist/bundle/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 预览路径（手动触发且不部署）：仍用 artifact 让 run 页面能直接下载，保留 1 天
      - name: Upload artifacts
        if: ${{ github.event_name != 'release' && github.event.inputs.deploy != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: universal-shell-${{ matrix.label }}
          path: dist/
          retention-days: 1

  checksums:
    name: Merge sha256.txt
    needs: build
    runs-on: ubuntu-latest
    # release 事件，或手动触发且勾选了 deploy 时才需要
    if: >-
      ${{
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      }}
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 复用 version 输入，拼出带 v 前缀的 tag：v0.1.0
            V="${{ github.event.inputs.version }}"
            echo "value=v${V#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # 各平台已把安装包直接传到 Release，这里只补一份汇总的 sha256.txt。
      # 优先用 GitHub 为每个资产记录的 sha256 digest（零下载）；取不到才回退为下载后计算。
      - name: Assemble sha256.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.digest != null and .digest != "")
                   | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            | sort -k2 > sha256.txt || true

          if [ ! -s sha256.txt ]; then
            echo "::warning::release assets 没有 digest，回退为下载后本地计算"
            mkdir -p dl
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --clobber
            ( cd dl && sha256sum * | sort -k2 ) > sha256.txt
          fi

          echo "== sha256.txt =="
          cat sha256.txt
          gh release upload "$TAG" sha256.txt --repo "$GITHUB_REPOSITORY" --clobber

  docker:
    name: Publish multi-arch Docker image
    # 原来 needs: release（该 job 已由 checksums 取代）。停用期间不需要任何前置。
    runs-on: ubuntu-latest
    # 暂时停用（2026-11-17，恢复待定）：发版不再自动推镜像。
    # 恢复时把下面一行换回：if: github.event_name == 'release'
    if: ${{ false }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_GHCR: ghcr.io
      # Docker Hub 凭据转成 job 级 env，`if:` 里才能引用（secrets 不能出现在 if 表达式）
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and image name
        id: version
        run: |
          V="${{ github.event.release.tag_name }}"
          V="${V#v}"
          # ghcr 要求仓库名（含 owner）全小写；GitHub 表达式无 lower()，在 shell 里转
          IMG="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check release assets exist
        run: |
          V="${{ steps.version.outputs.value }}"
          for a in x86_64 arm64; do
            url="https://github.com/${{ github.repository }}/releases/download/v${V}/universal-shell-cli-${V}-linux-${a}"
            code=$(curl -sL -o /dev/null -w '%{http_code}' -I "$url")
            if [ "$code" != "200" ]; then
              echo "Missing asset: $url (HTTP $code)"
              exit 1
            fi
            echo "OK: $url"
          done
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ steps.version.outputs.image }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ steps.version.outputs.image }}:${{ steps.version.outputs.value }}

      # Docker Hub 与 ghcr 用同一份多架构构件；仅当配置了 Docker Hub 凭据时才推送
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/universal-shell:latest
            docker.io/${{ env.DOCKERHUB_USERNAME }}/universal-shell:${{ steps.version.outputs.value }}
