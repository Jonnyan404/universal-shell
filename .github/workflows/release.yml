name: Release (universal-shell Rust)

on:
  # 创建/发布 GitHub Release 时自动构建并上传到该 Release
  release:
    types: [published]
  # 手动触发（不发布，仅构建产物供预览/测试）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macOS-x86_64
            # 标准 macOS runner 默认即为 arm64（Apple Silicon）；x64 需显式 -intel
            os: macos-15-intel
          - label: macOS-arm64
            os: macos-15
          - label: windows-x86_64
            os: windows-latest
          - label: windows-arm64
            # 官方原生 Windows ARM64 runner（Ampere Altra，非仿真）
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri frontend deps
        run: |
          cd app-tauri
          npm install
        shell: bash

      - name: Install Linux egui runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libxkbcommon0 libxcb1 libegl1 \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libfontconfig-dev
        shell: bash

      - name: Install WiX Toolset (Windows .msi)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix --locked
          dotnet tool install --global wix
          echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${{ github.event.release.tag_name }}"
          fi
          V=$(echo "$V" | sed 's/^v//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
        shell: bash

      # ---- egui：各平台原生自产自的安装包（不复用本地 build-release.sh，其专为单机多目标设计）----
      - name: Build egui binary
        run: cargo build --release -p app-egui
        shell: bash

      - name: Package egui (Windows .exe + .msi)
        if: runner.os == 'Windows'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          APP="universal-shell-egui"
          EGUI="dist/egui/windows"
          if echo "${{ matrix.label }}" | grep -q arm64; then
            TGT="aarch64-pc-windows-msvc"
          else
            TGT="x86_64-pc-windows-msvc"
          fi
          mkdir -p "$EGUI"
          cp "target/$TGT/release/$APP.exe" "$EGUI/$APP-$VERSION-$TGT.exe"
          (cd app-egui && cargo wix --nocapture --no-build \
            --target "$TGT" --target-bin-dir "../../../target/$TGT/release" \
            -o "../$EGUI/$APP-$VERSION-$TGT.msi")
        shell: bash

      - name: Package egui (macOS .app + .dmg)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd "$GITHUB_WORKSPACE"
          APP="universal-shell-egui"
          EGUI="dist/egui/macos"
          APPNAME="$EGUI/$APP.app"
          mkdir -p "$APPNAME/Contents/MacOS" "$APPNAME/Contents/Resources"
          cp "target/release/$APP" "$APPNAME/Contents/MacOS/$APP"
          cp "assets/icons/egui-bundle/icon.icns" "$APPNAME/Contents/Resources/icon.icns"
          cat > "$APPNAME/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Universal Shell</string>
            <key>CFBundleDisplayName</key><string>Universal Shell</string>
            <key>CFBundleIdentifier</key><string>com.universal.shell.egui</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          chmod +x "$APPNAME/Contents/MacOS/$APP"
          STAGE="$EGUI/.dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$APPNAME" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Universal Shell $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "$EGUI/$APP-$VERSION.dmg" >/dev/null
          rm -rf "$STAGE"
        shell: bash

      - name: Package egui (Linux binary)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          APP="universal-shell-egui"
          EGUI="dist/egui/linux"
          mkdir -p "$EGUI"
          cp "target/release/$APP" "$EGUI/$APP-$VERSION-${{ matrix.label }}"
          chmod +x "$EGUI/$APP-$VERSION-${{ matrix.label }}"
        shell: bash

      # ---- tauri：仅在 Linux/macOS 由 cargo tauri build 原生产出 ----
      - name: Build tauri bundle (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          (cd app-tauri && cargo tauri build) \
            && cp -R target/release/bundle dist/bundle
        shell: bash

      - name: SHA256
        run: |
          : > dist/sha256.txt
          if command -v sha256sum >/dev/null; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          find dist -type f -not -name sha256.txt -print0 \
            | while IFS= read -r -d '' f; do
                $HASH "$f" | awk -v p="${f#dist/}" '{print $1"  "p}' >> dist/sha256.txt
              done
        shell: bash

      - name: Inspect artifacts
        run: |
          find dist -maxdepth 3 -type f
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-shell-${{ matrix.label }}
          path: dist/
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: universal-shell-*
          path: dist/
          merge-multiple: true

      - name: Restore execute permissions
        # upload-artifact 的 zip 会剥掉 +x（全部变 644/755）；恢复可执行产物的执行位，
        # 保证 Release 里 Linux/macOS 二进制 / .app 内二进制可直接运行
        run: |
          find dist -type f \
            \( -name 'universal-shell-egui-*' \
               -o -path '*/Contents/MacOS/*' \
               -o -path '*/bin/*' \) \
            -exec chmod +x {} +
        shell: bash

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
