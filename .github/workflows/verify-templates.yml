name: Verify Templates

# 每日真去上游校验模板库里的模板是否仍可用（release 资产命名 / HTTP 直链是否变化），
# 并对代表性模板做端到端下载验证（下载 → 解压 → 可执行）。
#
# 模板库是独立仓库且为 public：这里匿名 clone 即可，不需要任何跨仓库凭据
# （GITHUB_TOKEN 仅用于提高 GitHub API 限额、避免匿名 60 次/小时的限流）。

on:
  schedule:
    # 每天 UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TEMPLATES_REPO: Jonnyan404/universal-shell-templates

jobs:
  verify:
    name: verify_templates (${{ matrix.os }})
    # 真实验证各 OS 候选：macOS->darwin, ubuntu->linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - name: Checkout tooling (this repo)
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Clone template library
        run: git clone --depth 1 "https://github.com/${TEMPLATES_REPO}.git" lib

      - name: verify_templates
        run: |
          cargo run -p shared --example verify_templates -- \
            "$GITHUB_WORKSPACE/lib/templates" "$GITHUB_WORKSPACE/lib/example-third-party/templates"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e representative download (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout tooling (this repo)
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Clone template library
        run: git clone --depth 1 "https://github.com/${TEMPLATES_REPO}.git" lib

      - name: e2e download (representative subset)
        run: >-
          cargo run -p shared --example e2e_download --
          dufs miniserve filebrowser
        env:
          US_TEMPLATES_DIR: ${{ github.workspace }}/lib/templates
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
