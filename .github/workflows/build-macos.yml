name: Build macOS (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: false
        default: '0.1.0'
      arch:
        description: '架构'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x86_64
          - arm64
      deploy:
        description: '构建后部署到 release tag v<version> (确认已存在 release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      overwrite_assets:
        description: '覆盖重名资产 (否则同名资产会跳过)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (macOS-${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 官方 macOS runner 默认即 arm64；x64 需显式 -intel
          - label: x86_64
            os: macos-15-intel
          - label: arm64
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Tauri frontend deps
        run: |
          cd app-tauri
          npm install
        shell: bash

      - name: Resolve version
        id: version
        run: |
          V="${{ github.event.inputs.version }}"
          V=$(echo "$V" | sed 's/^v//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Filter arch
        run: |
          if [ "${{ github.event.inputs.arch }}" != "all" ] \
             && [ "${{ github.event.inputs.arch }}" != "${{ matrix.label }}" ]; then
            echo "skip=1" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Build egui binary
        if: env.skip != '1'
        run: cargo build --release -p app-egui
        shell: bash

      - name: Build CLI (us-web)
        if: env.skip != '1'
        run: cargo build --release -p app-cli
        shell: bash

      - name: Package CLI (us-web)
        if: env.skip != '1'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          CLI="dist/cli/macos"
          mkdir -p "$CLI"
          # 资产名对齐 release.yml：带 macOS- 平台前缀，保证 release 部署时可覆盖同名资产
          cp "target/release/us-web" "$CLI/universal-shell-cli-$VERSION-macOS-${{ matrix.label }}"
          chmod +x "$CLI/universal-shell-cli-$VERSION-macOS-${{ matrix.label }}"
        shell: bash

      - name: Package egui (macOS .app + .dmg)
        if: env.skip != '1'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd "$GITHUB_WORKSPACE"
          APP="universal-shell-egui"
          EGUI="dist/egui/macos"
          # 资产名对齐 release.yml：dmg 用 aarch64/x86_64（非 arm64/x86_64 混排），保证可覆盖同名资产
          if [ "${{ matrix.label }}" = "arm64" ]; then
            ARCH="aarch64"
          else
            ARCH="x86_64"
          fi
          APPNAME="$EGUI/$APP.app"
          mkdir -p "$APPNAME/Contents/MacOS" "$APPNAME/Contents/Resources"
          cp "target/release/$APP" "$APPNAME/Contents/MacOS/$APP"
          cp "assets/icons/egui-bundle/icon.icns" "$APPNAME/Contents/Resources/icon.icns"
          cat > "$APPNAME/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Universal Shell</string>
            <key>CFBundleDisplayName</key><string>Universal Shell</string>
            <key>CFBundleIdentifier</key><string>com.universal.shell.egui</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          chmod +x "$APPNAME/Contents/MacOS/$APP"
          STAGE="$EGUI/.dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$APPNAME" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Universal Shell $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "$EGUI/$APP-$VERSION-$ARCH.dmg" >/dev/null
          rm -rf "$STAGE"
          # dist/**/* 会上传整个 dist，删掉 .app 目录避免其内部文件
          # (Info.plist / icon.icns / 裸二进制)当独立资产混进 Release
          rm -rf "$APPNAME"
        shell: bash

      - name: Build tauri bundle
        if: env.skip != '1'
        env:
          # 注入版本：App 内版本/自更新检查与本次一致（对齐 release.yml）
          UNIVERSAL_SHELL_VERSION: ${{ steps.version.outputs.value }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          (cd app-tauri && npx tauri build --bundles app,dmg \
            --config "{\"version\":\"$VERSION\"}")
          mkdir -p dist/bundle
          # 只保留最终 dmg 并统一命名为 universal-shell-tauri-<原名>（对齐 release.yml）
          find target/release/bundle -type f -name '*.dmg' \
            -exec sh -c '
              b=$(basename "$1"); b=${b#universal-shell_}
              case "$b" in universal-shell-*) b=${b#universal-shell-};; esac
              cp "$1" "dist/bundle/universal-shell-tauri-$b"
            ' _ {} \;
        shell: bash

      - name: SHA256
        if: env.skip != '1'
        run: |
          : > dist/sha256.txt
          if command -v sha256sum >/dev/null; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          find dist -type f -not -name sha256.txt -print0 \
            | while IFS= read -r -d '' f; do
                $HASH "$f" | awk -v p="${f#dist/}" '{print $1"  "p}' >> dist/sha256.txt
              done
        shell: bash

      - name: Inspect artifacts
        if: env.skip != '1'
        run: |
          find dist -maxdepth 3 -type f
        shell: bash

      - name: Upload artifacts
        if: env.skip != '1'
        uses: actions/upload-artifact@v7
        with:
          name: universal-shell-macos-${{ matrix.label }}
          path: dist/
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # 手动触发且勾选了 deploy 时才部署到 release tag v<version>
    if: github.event.inputs.deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: universal-shell-macos-*
          path: dist/
          merge-multiple: true

      - name: Restore execute permissions
        # upload-artifact 的 zip 会剥掉 +x；恢复可执行产物/.app 内二进制的执行位
        run: |
          find dist -type f \
            \( -name 'universal-shell-egui-*' \
               -o -name 'universal-shell-cli-*' \
               -o -path '*/Contents/MacOS/*' \) \
            -exec chmod +x {} +
        shell: bash

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          # overwrite=true 时先删除同名旧资产再上传，实现"追加/覆盖"
          overwrite: ${{ github.event.inputs.overwrite_assets != 'false' }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
