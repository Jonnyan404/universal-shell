name: Publish Docker images (manual)

on:
  # 仅手动触发：release 事件已由 release.yml 内的 docker job 负责。
  # 手动触发适合「构建产物已就绪、补发/重发镜像」的场景。
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: true
        default: '0.2.2'

concurrency:
  group: docker-manual-${{ github.event.inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY_GHCR: ghcr.io
  # Docker Hub 凭据转成 job 级 env，`if:` 里才能引用（secrets 不能出现在 if 表达式）
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and image name
        id: version
        run: |
          V="${{ github.event.inputs.version }}"
          V="${V#v}"
          # ghcr 要求仓库名（含 owner）全小写；GitHub 表达式无 lower()，在 shell 里转
          IMG="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先确认 release 资产可用。release 触发时 release.yml（构建+上传）与本工作流
      # 并发启动，资产可能尚未传完——轮询等待上限 20 分钟，避免 404 误失败。
      - name: Wait for release assets
        run: |
          V="${{ steps.version.outputs.value }}"
          urls=""
          for a in x86_64 arm64; do
            urls="$urls https://github.com/${{ github.repository }}/releases/download/v${V}/universal-shell-cli-${V}-linux-${a}"
          done
          for i in $(seq 1 120); do
            missing=""
            for url in $urls; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' -I "$url")
              if [ "$code" != "200" ]; then missing="$missing $url(HTTP $code)"; fi
            done
            if [ -z "$missing" ]; then
              echo "All assets ready:"
              echo "$urls" | tr ' ' '\n' | sed '/^$/d' | while read -r u; do echo "  OK: $u"; done
              exit 0
            fi
            echo "[$i/120] waiting for release assets:$missing"
            sleep 10
          done
          echo "Timed out waiting for release assets"
          exit 1
        shell: bash

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ steps.version.outputs.image }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ steps.version.outputs.image }}:${{ steps.version.outputs.value }}

      # Docker Hub 与 ghcr 用同一份多架构构件；仅当配置了 Docker Hub 凭据时才推送
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/universal-shell:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/universal-shell:${{ steps.version.outputs.value }}