<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 B · 高密度数据表 — Universal Shell 布局原型</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f1f5f9;--panel:#fff;--panel2:#eef1f6;--text:#1e293b;--muted:#64748b;
  --border:rgba(148,163,184,.28);--border-strong:rgba(148,163,184,.5);
  --accent:#4f8cff;--accent-soft:rgba(79,140,255,.12);
  --ok:#16a34a;--ok-soft:rgba(22,163,74,.12);--warn:#d97706;--danger:#e11d48;--danger-soft:rgba(225,29,72,.1);
}
html,body{height:100%}
body{margin:0;font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.45);border-radius:8px;border:3px solid transparent;background-clip:content-box}

.proto-bar{height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0f172a;color:#cbd5e1;font-size:12px;flex-shrink:0}
.proto-bar a{display:flex;align-items:center;gap:5px;color:#e2e8f0;padding:4px 8px;border-radius:7px;border:1px solid rgba(148,163,184,.35)}
.proto-bar a:hover{background:rgba(148,163,184,.15)}
.proto-bar .pb-title{font-weight:700;color:#fff}
.proto-bar .pb-sep{width:1px;height:14px;background:rgba(148,163,184,.35)}
.proto-bar .pb-chips{display:flex;gap:6px}
.pb-chip{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(79,140,255,.16);color:#bfd4ff;border:1px solid rgba(79,140,255,.3)}
.proto-bar .spacer{flex:1}
.scale-wrap{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#94a3b8}
.scale-wrap select{background:#1e293b;color:#e2e8f0;border:1px solid rgba(148,163,184,.35);border-radius:7px;padding:3px 6px;font-size:11.5px}

.app{display:flex;height:calc(100vh - 38px)}
.iconrail{width:52px;min-width:52px;background:#0f172a;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
.iconrail .ir-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#4f8cff,#2f6fe4);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;margin-bottom:8px}
.iconrail button{width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:#94a3b8;display:grid;place-items:center}
.iconrail button:hover{background:rgba(148,163,184,.14);color:#e2e8f0}
.iconrail button.on{background:rgba(79,140,255,.2);color:#8fb6ff}
.iconrail button svg{width:16px;height:16px}
.iconrail .spacer{flex:1}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{padding:12px 16px 0;background:#fff;border-bottom:1px solid var(--border)}
.head-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.title{font-size:15px;font-weight:700;letter-spacing:.2px}
.title small{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px}
.head .spacer{flex:1}
.search{position:relative;width:250px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#94a3b8}
.search input{width:100%;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);padding:0 10px 0 28px;font-size:12px;outline:none}
.search input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:24px;padding:0 7px;font-size:11px;border-radius:6px}
.btn svg{width:12px;height:12px}
.filters{display:flex;align-items:center;gap:6px;padding-bottom:10px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:11.5px;color:#475569}
.fchip:hover{border-color:var(--border-strong)}
.fchip.on{background:var(--accent-soft);border-color:rgba(79,140,255,.45);color:#1e40af;font-weight:600}
.fchip .x{color:#94a3b8;font-size:12px;line-height:1}
.fchip .n{font-size:10.5px;background:rgba(148,163,184,.18);padding:0 5px;border-radius:99px;font-variant-numeric:tabular-nums}

/* 批量条（表格模式专用：贴在工具栏下方，不遮挡行） */
.bulkbar{display:none;align-items:center;gap:6px;padding:7px 16px;background:#eef4ff;border-bottom:1px solid rgba(79,140,255,.25);font-size:12px;color:#1e40af}
.bulkbar.show{display:flex}
.bulkbar b{font-weight:700}
.bulkbar .b{height:25px;padding:0 9px;border-radius:7px;border:1px solid rgba(79,140,255,.35);background:#fff;color:#1e40af;font-size:11.5px}
.bulkbar .b:hover{background:#e0ebff}
.bulkbar .b.danger{color:#be123c;border-color:rgba(225,29,72,.35)}
.bulkbar .spacer{flex:1}

.tablewrap{flex:1;overflow:auto;background:#fff;position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{position:sticky;top:0;z-index:5;background:#f8fafc;border-bottom:1px solid var(--border);text-align:left;font-size:11px;letter-spacing:.4px;color:#64748b;font-weight:600;padding:8px 10px;white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{background:#f1f5f9;color:#334155}
thead th .arrow{font-size:9px;color:#94a3b8;margin-left:3px}
thead th.sorted .arrow{color:var(--accent)}
tbody td{padding:7px 10px;border-bottom:1px solid rgba(148,163,184,.16);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:#f8fbff}
tbody tr.picked{background:#eff5ff}
tbody tr.picked td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.cbcell{width:34px;padding-left:14px!important}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;margin:0}
.cell-name{display:flex;align-items:center;gap:8px;min-width:190px}
.avatar{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800;flex-shrink:0}
.nm{font-weight:600;color:#0f172a}
.nm-sub{font-size:10.5px;color:#94a3b8;font-variant-numeric:tabular-nums;margin-left:5px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.running{background:var(--ok-soft);color:#15803d}
.pill.stopped{background:var(--panel2);color:#64748b}
.pill.error{background:var(--danger-soft);color:#be123c}
.pill.missing{color:#94a3b8;border:1px dashed var(--border-strong)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#475569}
.cat i{width:6px;height:6px;border-radius:2px}
.ver{font-variant-numeric:tabular-nums;font-size:11.5px;color:#334155}
.upbadge{font-size:10px;font-weight:700;color:#1d4ed8;background:var(--accent-soft);border-radius:5px;padding:1px 5px;margin-left:5px}
.port{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#334155}
.sup{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--border);color:#475569;background:#fff}
.sup.sys{background:rgba(217,119,6,.09);border-color:rgba(217,119,6,.28);color:#b45309}
.switch{position:relative;width:28px;height:16px;border-radius:99px;background:#cbd5e1;display:inline-block;cursor:pointer;transition:.15s;vertical-align:middle}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{left:14px}
.rowacts{display:flex;gap:3px;opacity:0;transition:.1s}
tr:hover .rowacts{opacity:1}
.rowacts button{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:#64748b}
.rowacts button:hover{background:#eef4ff;border-color:rgba(79,140,255,.3);color:#1d4ed8}
.rowacts svg{width:12px;height:12px}
.uptime{font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums}

.dense tbody td{padding:3px 10px;font-size:12px}
.dense .avatar{width:18px;height:18px;border-radius:5px;font-size:9px}
.dense thead th{padding:6px 10px}
.dense .nm-sub{display:none}

.foot{height:34px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);flex-shrink:0}
.foot b{color:#334155;font-variant-numeric:tabular-nums}
.foot .spacer{flex:1}
.foot .legend{display:flex;align-items:center;gap:4px}
.foot .legend i{width:6px;height:6px;border-radius:50%;display:block}

.colmenu{position:absolute;right:16px;top:96px;z-index:30;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px -12px rgba(15,23,42,.35);padding:8px;width:190px;display:none}
.colmenu.show{display:block}
.colmenu .cm-title{font-size:10.5px;color:#94a3b8;font-weight:700;letter-spacing:.4px;padding:2px 6px 6px}
.colmenu label{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.colmenu label:hover{background:var(--panel2)}
.toast{position:fixed;right:18px;bottom:52px;background:#0f172a;color:#fff;font-size:12px;padding:9px 13px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.18s;z-index:50}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>

<div class="proto-bar">
  <a href="index.html">← 方案总览</a>
  <span class="pb-sep"></span>
  <span class="pb-title">方案 B · 高密度数据表</span>
  <span class="pb-chips">
    <span class="pb-chip">信息密度 最高</span>
    <span class="pb-chip">导航 排序 + 列筛选</span>
    <span class="pb-chip">批量效率 最高</span>
  </span>
  <span class="spacer"></span>
  <label class="scale-wrap">规模
    <select id="scale">
      <option value="24">24 个</option>
      <option value="48" selected>48 个</option>
      <option value="120">120 个</option>
    </select>
  </label>
</div>

<div class="app">
  <nav class="iconrail">
    <span class="ir-logo">US</span>
    <button class="on" title="程序"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M2.5 6.5h11M6.5 6.5v7"/></svg></button>
    <button title="模板库"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.2l5.3 2.8L8 7.8 2.7 5z"/><path d="M2.7 8L8 10.8 13.3 8M2.7 11L8 13.8l5.3-2.8"/></svg></button>
    <button title="日志"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h10M3 12h6"/></svg></button>
    <span class="spacer"></span>
    <button title="设置"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg></button>
  </nav>

  <main class="main">
    <div class="head">
      <div class="head-row">
        <div class="title">全部程序 <small id="sub">48 个 · 31 运行中</small></div>
        <span class="spacer"></span>
        <div class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
          <input id="q" placeholder="搜索名称 / id / 端口…" />
        </div>
        <button class="btn" id="colbtn">列设置</button>
        <button class="btn" id="densbtn">紧凑</button>
        <button class="btn primary" id="newbtn">＋ 新建</button>
      </div>
      <div class="filters" id="filters">
        <button class="fchip on" data-f="all">全部 <span class="n" id="n-all">48</span></button>
        <button class="fchip" data-f="running">运行中 <span class="n" id="n-run">31</span></button>
        <button class="fchip" data-f="error">异常 <span class="n" id="n-err">2</span></button>
        <button class="fchip" data-f="update">有更新 <span class="n" id="n-upd">5</span></button>
        <button class="fchip" data-f="native">系统调度 <span class="n" id="n-sys">9</span></button>
        <button class="fchip" data-f="missing">未安装 <span class="n" id="n-mis">0</span></button>
        <span style="width:1px;height:16px;background:var(--border);margin:0 3px"></span>
        <button class="fchip" data-sort="port">按端口排序</button>
      </div>
    </div>

    <div class="bulkbar" id="bulkbar">
      <b id="bulk-n">已选 0 项</b>
      <span style="color:#64748b">·</span>
      <button class="b" data-act="start">启动</button>
      <button class="b" data-act="stop">停止</button>
      <button class="b" data-act="restart">重启</button>
      <button class="b" data-act="update">检查更新</button>
      <button class="b" data-act="auto">开启自启</button>
      <span class="spacer"></span>
      <button class="b danger" data-act="delete">删除</button>
      <button class="b" data-act="clear">取消选择</button>
    </div>

    <div class="tablewrap" id="tw">
      <table id="tbl">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="foot">
      <span>显示 <b id="f-shown">0</b> / <b id="f-total">0</b> 项</span>
      <span>·</span>
      <span>已选 <b id="f-sel">0</b></span>
      <span>·</span>
      <span id="f-density">行高 32px · 每屏约 17 行</span>
      <span class="spacer"></span>
      <span class="legend"><i style="background:#16a34a"></i>运行中</span>
      <span class="legend"><i style="background:#94a3b8"></i>已停止</span>
      <span class="legend"><i style="background:#e11d48"></i>异常</span>
      <span style="margin-left:8px">排序：<b id="f-sort">默认</b></span>
    </div>

    <div class="colmenu" id="colmenu">
      <div class="cm-title">显示列</div>
      <label><input type="checkbox" data-col="cat" checked> 分类</label>
      <label><input type="checkbox" data-col="ver" checked> 版本</label>
      <label><input type="checkbox" data-col="port" checked> 端口</label>
      <label><input type="checkbox" data-col="sup" checked> 调度归属</label>
      <label><input type="checkbox" data-col="auto" checked> 开机自启</label>
      <label><input type="checkbox" data-col="up" checked> 运行时长</label>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

];
const CAT_COLOR = {'文件共享':'#4f8cff','同步与备份':'#8b5cf6','代理与网络':'#0ea5e9','存储与数据库':'#f59e0b','开发工具':'#10b981','媒体服务':'#ec4899','监控运维':'#ef4444','知识管理':'#6366f1','下载工具':'#14b8a6','导航面板':'#a855f7'};
const TILE = ['#4f8cff','#8b5cf6','#0ea5e9','#f59e0b','#10b981','#ec4899','#ef4444','#6366f1','#14b8a6','#a855f7'];
const ST = {running:'运行中',stopped:'已停止',error:'异常',missing:'未安装'};

function build(n){
  let list=RAW.map((r,i)=>({id:r[0],name:r[1],cat:r[2],state:r[3],sup:r[4],ver:r[5],latest:r[6],port:r[7],auto:!!r[8],up:r[9],hue:TILE[i%TILE.length]}));
  if(n>list.length){
    const cats=[...new Set(RAW.map(r=>r[2]))];
    const states=['running','running','running','running','running','stopped','stopped','stopped','stopped','stopped','error','running'];
    for(let i=list.length;i<n;i++){
      const base=RAW[i%RAW.length],k=Math.floor(i/RAW.length);
      list.push({id:base[0]+'-w'+String(k).padStart(2,'0'),name:base[1]+' #'+k,cat:cats[i%cats.length],
        state:states[i%states.length],sup:i%3===0?'native':'managed',ver:base[5],
        latest:i%7===0?base[5].replace(/(\d+)$/,m=>+m+1):'',port:10000+(i*7)%40000,
        auto:i%2===0,up:i%3===0?'1d 3h':'',hue:TILE[i%TILE.length]});
    }
  }
  return list;
}

const COLS=[
  {k:'state',label:'状态',w:'92px',sort:1},
  {k:'name',label:'名称 / ID',w:'auto',sort:1},
  {k:'cat',label:'分类',w:'118px',sort:1},
  {k:'ver',label:'版本',w:'150px',sort:1},
  {k:'port',label:'端口',w:'74px',sort:1},
  {k:'sup',label:'调度',w:'86px',sort:1},
  {k:'auto',label:'自启',w:'58px',sort:1},
  {k:'up',label:'运行时长',w:'86px',sort:1}
];
const S={items:build(48),filter:'all',q:'',dense:false,checked:new Set(),sortKey:'',sortDir:1,cols:new Set(['cat','ver','port','sup','auto','up']),lastIdx:-1};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICO={
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.6l8.2 5.4-8.2 5.4z"/></svg>',
  stop:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.6" y="3.6" width="8.8" height="8.8" rx="1.6"/></svg>',
  log:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg>',
  more:'<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg>',
  open:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 3.5H3.5v9h9v-3"/><path d="M9 3.5h3.5V7M12.5 3.5L7 9"/></svg>'
};

function visible(){
  const q=S.q.trim().toLowerCase();
  let rows=S.items.filter(i=>{
    if(S.filter==='running'&&i.state!=='running') return false;
    if(S.filter==='error'&&i.state!=='error') return false;
    if(S.filter==='update'&&!(i.latest&&i.latest!==i.ver)) return false;
    if(S.filter==='native'&&i.sup!=='native') return false;
    if(S.filter==='missing'&&i.state!=='missing') return false;
    if(q&&!(i.name+' '+i.id+' '+i.port+' '+i.cat).toLowerCase().includes(q)) return false;
    return true;
  });
  if(S.sortKey){
    const k=S.sortKey;
    rows=rows.slice().sort((a,b)=>{
      let x=a[k],y=b[k];
      if(k==='state'){ const rank={running:0,error:1,stopped:2,missing:3}; x=rank[x];y=rank[y]; }
      if(typeof x==='number'&&typeof y==='number') return (x-y)*S.sortDir;
      return String(x).localeCompare(String(y),'zh')*S.sortDir;
    });
  }
  return rows;
}

function renderHead(){
  const ths=[`<th class="cbcell"><input type="checkbox" id="selall"></th>`];
  for(const c of COLS){
    if(['cat','ver','port','sup','auto','up'].includes(c.k)&&!S.cols.has(c.k)) continue;
    const sorted=S.sortKey===c.k;
    ths.push(`<th class="sortable ${sorted?'sorted':''}" data-sort="${c.k}" style="width:${c.w}">${c.label}<span class="arrow">${sorted?(S.sortDir>0?'▲':'▼'):'↕'}</span></th>`);
  }
  ths.push(`<th style="width:96px">操作</th>`);
  $('#thead-row').innerHTML=ths.join('');
}

function row(i){
  const upd=i.latest&&i.latest!==i.ver;
  const picked=S.checked.has(i.id);
  const cols=[];
  if(S.cols.has('cat')) cols.push(`<td><span class="cat"><i style="background:${CAT_COLOR[i.cat]||'#94a3b8'}"></i>${esc(i.cat)}</span></td>`);
  if(S.cols.has('ver')) cols.push(`<td><span class="ver">${i.ver?('v'+esc(i.ver)):'—'}</span>${upd?`<span class="upbadge">↑ ${esc(i.latest)}</span>`:''}</td>`);
  if(S.cols.has('port')) cols.push(`<td><span class="port">${i.port?':'+i.port:'—'}</span></td>`);
  if(S.cols.has('sup')) cols.push(`<td><span class="sup ${i.sup==='native'?'sys':''}">${i.sup==='native'?'系统调度':'壳托管'}</span></td>`);
  if(S.cols.has('auto')) cols.push(`<td><span class="switch ${i.auto?'on':''}" data-auto="${i.id}"></span></td>`);
  if(S.cols.has('up')) cols.push(`<td><span class="uptime">${i.state==='running'?(i.up||'刚刚'):'—'}</span></td>`);
  return `<tr class="${picked?'picked':''}" data-row="${i.id}">
    <td class="cbcell"><input type="checkbox" data-check="${i.id}" ${picked?'checked':''}></td>
    <td><span class="pill ${i.state}"><i></i>${ST[i.state]}</span></td>
    <td><div class="cell-name"><span class="avatar" style="background:${i.hue}">${esc(i.name.slice(0,1).toUpperCase())}</span>
      <span><span class="nm">${esc(i.name)}</span><span class="nm-sub">${esc(i.id)}</span></span></div></td>
    ${cols.join('')}
    <td><div class="rowacts">
      ${i.state==='running'?`<button title="停止" data-act="stop" data-id="${i.id}">${ICO.stop}</button>`:`<button title="启动" data-act="start" data-id="${i.id}">${ICO.play}</button>`}
      <button title="日志" data-act="log" data-id="${i.id}">${ICO.log}</button>
      <button title="打开" data-act="open" data-id="${i.id}">${ICO.open}</button>
      <button title="更多" data-act="more" data-id="${i.id}">${ICO.more}</button>
    </div></td>
  </tr>`;
}

function render(){
  renderHead();
  const rows=visible();
  $('#tbody').innerHTML=rows.length?rows.map(row).join(''):`<tr><td colspan="10" style="text-align:center;padding:50px;color:#94a3b8">没有匹配项</td></tr>`;
  $('#tbl').className=S.dense?'dense':'';
  const c=counts();
  $('#n-all').textContent=c.all; $('#n-run').textContent=c.running; $('#n-err').textContent=c.error;
  $('#n-upd').textContent=c.update; $('#n-sys').textContent=c.native; $('#n-mis').textContent=c.missing;
  $('#sub').textContent=c.all+' 个 · '+c.running+' 运行中';
  $('#f-shown').textContent=rows.length; $('#f-total').textContent=c.all;
  $('#f-sel').textContent=S.checked.size;
  $('#f-density').textContent=S.dense?'行高 24px · 每屏约 24 行':'行高 32px · 每屏约 17 行';
  $('#f-sort').textContent=S.sortKey?COLS.find(x=>x.k===S.sortKey).label+(S.sortDir>0?' ↑':' ↓'):'默认';
  $('#bulkbar').classList.toggle('show',S.checked.size>0);
  $('#bulk-n').textContent='已选 '+S.checked.size+' 项';
  const all=rows.length&&rows.every(i=>S.checked.has(i.id));
  const some=rows.some(i=>S.checked.has(i.id));
  const sa=$('#selall'); if(sa){ sa.checked=all; sa.indeterminate=!all&&some; }
}

function counts(){
  const it=S.items;
  return {all:it.length,running:it.filter(i=>i.state==='running').length,
    error:it.filter(i=>i.state==='error').length,
    update:it.filter(i=>i.latest&&i.latest!==i.ver).length,
    native:it.filter(i=>i.sup==='native').length,
    missing:it.filter(i=>i.state==='missing').length};
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1700);}

/* 事件 */
$('#thead-row').addEventListener('click',e=>{
  const th=e.target.closest('[data-sort]');
  if(th){ const k=th.dataset.sort; S.sortDir=S.sortKey===k?-S.sortDir:1; S.sortKey=k; render(); }
});
$('#tbody').addEventListener('click',e=>{
  const sw=e.target.closest('[data-auto]');
  if(sw){ const it=S.items.find(i=>i.id===sw.dataset.auto); it.auto=!it.auto; sw.classList.toggle('on',it.auto); toast(it.name+(it.auto?' 已开启开机自启':' 已关闭开机自启')); return; }
  const act=e.target.closest('[data-act]');
  if(act){
    const it=S.items.find(i=>i.id===act.dataset.id), a=act.dataset.act;
    if(a==='start'){ it.state='running'; it.up='刚刚'; toast(it.name+' 已启动'); }
    if(a==='stop'){ it.state='stopped'; it.up=''; toast(it.name+' 已停止'); }
    if(a==='log'){ toast('打开日志：'+it.id); }
    if(a==='open'){ toast('在浏览器打开 '+(it.port?'http://127.0.0.1:'+it.port:'（无端口）')); }
    if(a==='more'){ toast('编辑 / 调度 / 删除'); }
    render(); return;
  }
  const tr=e.target.closest('[data-row]');
  if(tr&&!e.target.closest('input')&&!e.target.closest('.switch')){
    const id=tr.dataset.row, rows=visible(), idx=rows.findIndex(i=>i.id===id);
    if(e.shiftKey&&S.lastIdx>=0){
      const [a,b]=[Math.min(S.lastIdx,idx),Math.max(S.lastIdx,idx)];
      for(let i=a;i<=b;i++) S.checked.add(rows[i].id);
    } else {
      S.checked.has(id)?S.checked.delete(id):S.checked.add(id);
      S.lastIdx=idx;
    }
    render();
  }
});
$('#tbody').addEventListener('change',e=>{
  const cb=e.target.closest('[data-check]');
  if(cb){ cb.checked?S.checked.add(cb.dataset.check):S.checked.delete(cb.dataset.check); render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='selall'){
    const rows=visible();
    if(e.target.checked) rows.forEach(i=>S.checked.add(i.id)); else rows.forEach(i=>S.checked.delete(i.id));
    render();
  }
  if(e.target.id==='scale'){ const n=+e.target.value; S.items=build(n); S.checked.clear(); render(); toast('规模切换到 '+n+' 个'); }
  const col=e.target.closest('[data-col]');
  if(col){ col.checked?S.cols.add(col.dataset.col):S.cols.delete(col.dataset.col); render(); }
});
$('#filters').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');
  if(f){ S.filter=f.dataset.f; document.querySelectorAll('#filters [data-f]').forEach(b=>b.classList.toggle('on',b===f)); render(); }
  const s=e.target.closest('[data-sort="port"]');
  if(s){ S.sortDir=S.sortKey==='port'?-S.sortDir:1; S.sortKey='port'; render(); }
});
$('#bulkbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='clear'){ S.checked.clear(); render(); return; }
  if(a==='delete'){ toast('已删除 '+S.checked.size+' 项（示意）'); S.checked.clear(); render(); return; }
  S.items.forEach(i=>{ if(!S.checked.has(i.id)) return;
    if(a==='start'){ i.state='running'; i.up='刚刚'; }
    if(a==='stop'){ i.state='stopped'; i.up=''; }
    if(a==='restart'){ i.state='running'; i.up='刚刚'; }
    if(a==='auto') i.auto=true;
  });
  toast('已对 '+S.checked.size+' 项执行「'+({start:'启动',stop:'停止',restart:'重启',update:'检查更新',auto:'开启自启'})[a]+'」');
  render();
});
$('#q').addEventListener('input',e=>{ S.q=e.target.value; render(); });
$('#densbtn').addEventListener('click',()=>{ S.dense=!S.dense; $('#densbtn').textContent=S.dense?'标准':'紧凑'; render(); });
$('#colbtn').addEventListener('click',e=>{ e.stopPropagation(); $('#colmenu').classList.toggle('show'); });
document.addEventListener('click',e=>{ if(!e.target.closest('#colmenu')&&!e.target.closest('#colbtn')) $('#colmenu').classList.remove('show'); });
$('#newbtn').addEventListener('click',()=>toast('新建程序 / 手建服务'));

render();
</script>
</body>
</html>
