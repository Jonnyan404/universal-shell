<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>落地形态 · B+D 融合（桌面 / 移动）— Universal Shell</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f1f5f9;--panel:#fff;--panel2:#eef1f6;--text:#1e293b;--muted:#64748b;
  --border:rgba(148,163,184,.28);--border-strong:rgba(148,163,184,.5);
  --accent:#4f8cff;--accent-soft:rgba(79,140,255,.12);
  --ok:#16a34a;--ok-soft:rgba(22,163,74,.12);--danger:#e11d48;--danger-soft:rgba(225,29,72,.1);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{margin:0;font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.45);border-radius:8px;border:2px solid transparent;background-clip:content-box}

.proto-bar{height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0f172a;color:#cbd5e1;font-size:12px;flex-shrink:0}
.proto-bar a{display:flex;align-items:center;gap:5px;color:#e2e8f0;padding:4px 8px;border-radius:7px;border:1px solid rgba(148,163,184,.35)}
.proto-bar a:hover{background:rgba(148,163,184,.15)}
.proto-bar .pb-title{font-weight:700;color:#fff}
.proto-bar .pb-sep{width:1px;height:14px;background:rgba(148,163,184,.35)}
.pb-chip{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(79,140,255,.16);color:#bfd4ff;border:1px solid rgba(79,140,255,.3)}
.proto-bar .spacer{flex:1}
.devtoggle{display:flex;border:1px solid rgba(148,163,184,.35);border-radius:8px;overflow:hidden}
.devtoggle button{border:0;background:transparent;color:#94a3b8;padding:4px 10px;font-size:11.5px}
.devtoggle button.on{background:rgba(79,140,255,.2);color:#bfd4ff;font-weight:600}
.scale-wrap{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#94a3b8}
.scale-wrap select{background:#1e293b;color:#e2e8f0;border:1px solid rgba(148,163,184,.35);border-radius:7px;padding:3px 6px;font-size:11.5px}

/* ============ 桌面 ============ */
.desk{display:flex;height:calc(100vh - 38px)}
.desk.hide{display:none}
.iconrail{width:50px;min-width:50px;background:#0f172a;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:5px}
.iconrail .ir-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(140deg,#4f8cff,#2f6fe4);color:#fff;display:grid;place-items:center;font-weight:800;font-size:10px;margin-bottom:6px}
.iconrail button{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#94a3b8;display:grid;place-items:center}
.iconrail button:hover{background:rgba(148,163,184,.14);color:#e2e8f0}
.iconrail button.on{background:rgba(79,140,255,.2);color:#8fb6ff}
.iconrail svg{width:15px;height:15px}
.iconrail .spacer{flex:1}

.work{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.wbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.wtitle{font-size:14px;font-weight:700;letter-spacing:.2px}
.wtitle small{font-weight:400;font-size:11px;color:var(--muted);margin-left:5px}
.wbar .spacer{flex:1}
.search{position:relative;width:220px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#94a3b8}
.search input{width:100%;height:29px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);padding:0 10px 0 27px;font-size:12px;outline:none}
.search input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:29px;padding:0 10px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.btn.icon{width:29px;padding:0}
.btn svg{width:12px;height:12px}

.fbar{display:flex;align-items:center;gap:6px;padding:7px 14px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.fchip{height:25px;padding:0 9px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:11.5px;color:#475569;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fchip.on{background:var(--accent-soft);border-color:rgba(79,140,255,.45);color:#1e40af;font-weight:600}
.fchip .n{font-size:10px;background:rgba(148,163,184,.18);padding:0 5px;border-radius:99px;font-variant-numeric:tabular-nums}
.fbar .spacer{flex:1}
.hint{font-size:10.5px;color:#94a3b8;white-space:nowrap}

.bulkbar{display:none;align-items:center;gap:6px;padding:6px 14px;background:#eef4ff;border-bottom:1px solid rgba(79,140,255,.25);font-size:12px;color:#1e40af;flex-shrink:0}
.bulkbar.show{display:flex}
.bulkbar .b{height:24px;padding:0 9px;border-radius:7px;border:1px solid rgba(79,140,255,.35);background:#fff;color:#1e40af;font-size:11.5px}
.bulkbar .b.danger{color:#be123c;border-color:rgba(225,29,72,.35)}
.bulkbar .spacer{flex:1}

.split{flex:1;display:flex;min-height:0}
.tablewrap{flex:1;overflow:auto;min-width:0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{position:sticky;top:0;z-index:5;background:#f8fafc;border-bottom:1px solid var(--border);text-align:left;font-size:11px;letter-spacing:.4px;color:#64748b;font-weight:600;padding:8px 9px;white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{background:#f1f5f9;color:#334155}
thead th .arrow{font-size:9px;color:#94a3b8;margin-left:3px}
thead th.sorted .arrow{color:var(--accent)}
tbody td{padding:7px 9px;border-bottom:1px solid rgba(148,163,184,.16);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f8fbff}
tbody tr.on{background:#eff5ff;box-shadow:inset 3px 0 0 var(--accent)}
tbody tr.picked{background:#f3f8ff}
.cbcell{width:32px;padding-left:12px!important}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;margin:0}
.cell-name{display:flex;align-items:center;gap:7px;min-width:170px}
.avatar{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800;flex-shrink:0}
.nm{font-weight:600;color:#0f172a}
.nm-sub{font-size:10.5px;color:#94a3b8;font-family:var(--mono);margin-left:5px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.running{background:var(--ok-soft);color:#15803d}
.pill.stopped{background:var(--panel2);color:#64748b}
.pill.error{background:var(--danger-soft);color:#be123c}
.pill.missing{color:#94a3b8;border:1px dashed var(--border-strong)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#475569}
.cat i{width:6px;height:6px;border-radius:2px}
.ver{font-variant-numeric:tabular-nums;font-size:11.5px;color:#334155}
.upbadge{font-size:10px;font-weight:700;color:#1d4ed8;background:var(--accent-soft);border-radius:5px;padding:1px 5px;margin-left:5px}
.port{font-family:var(--mono);font-size:11.5px;color:#334155}
.sup{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--border);color:#475569;background:#fff}
.sup.sys{background:rgba(217,119,6,.09);border-color:rgba(217,119,6,.28);color:#b45309}
.switch{position:relative;width:26px;height:15px;border-radius:99px;background:#cbd5e1;display:inline-block;cursor:pointer;transition:.15s;vertical-align:middle}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:13px}
.uptime{font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums}
.dense tbody td{padding:3px 9px;font-size:12px}
.dense .avatar{width:18px;height:18px;border-radius:5px;font-size:9px}
.dense .nm-sub{display:none}
.dense thead th{padding:6px 9px}

/* 检查器 */
.inspect{width:376px;min-width:376px;border-left:1px solid var(--border);display:flex;flex-direction:column;background:#fff;transition:.15s}
.desk.noinspect .inspect{display:none}
.ihead{padding:12px 14px 0;border-bottom:1px solid var(--border)}
.itop{display:flex;align-items:flex-start;gap:10px}
.iavatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;flex-shrink:0}
.ititle{min-width:0;flex:1}
.ititle b{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ititle span{display:block;font-size:10.5px;color:#94a3b8;font-family:var(--mono);margin-top:1px}
.iacts{display:flex;gap:4px;flex-shrink:0}
.tabs{display:flex;gap:1px;margin-top:10px}
.tab{border:0;background:transparent;padding:7px 9px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#1e40af;font-weight:600;border-bottom-color:var(--accent)}
.ibody{flex:1;overflow-y:auto;padding:11px 14px 18px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.kpi{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fbfcfe}
.kpi .k{font-size:10px;color:#94a3b8}
.kpi .v{font-size:14px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:10px;font-weight:500;color:#94a3b8;margin-left:2px}
.sec{border:1px solid var(--border);border-radius:10px;margin-bottom:9px;overflow:hidden}
.sec-h{padding:7px 10px;font-size:11px;font-weight:600;background:#fbfcfe;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sec-h .spacer{flex:1}
.sec-h .hint{font-weight:400;font-size:10px}
.sec-b{padding:9px 10px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 8px;font-size:11.5px}
.kv dt{color:#94a3b8;font-size:11px}
.kv dd{margin:0;font-family:var(--mono);font-size:11px;color:#334155;word-break:break-all}
.kv dd .plain{font-family:inherit}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);color:#475569;font-family:var(--mono)}
.term{background:#0f172a;color:#cbd5e1;font-family:var(--mono);font-size:11px;line-height:1.6;padding:9px 10px;border-radius:0 0 10px 10px;max-height:190px;overflow:auto;white-space:pre-wrap}
.term .g{color:#4ade80}.term .y{color:#fbbf24}.term .r{color:#fb7185}.term .b{color:#93c5fd}.term .m{color:#64748b}
.logbar{display:flex;align-items:center;gap:5px;padding:5px 9px;background:#1e293b;color:#94a3b8;font-size:10px;border-radius:10px 10px 0 0}
.logbar .spacer{flex:1}
.logbar button{border:1px solid rgba(148,163,184,.3);background:transparent;color:#cbd5e1;height:19px;padding:0 6px;border-radius:5px;font-size:9.5px}
.emptyins{padding:40px 20px;text-align:center;color:#94a3b8;font-size:12px;line-height:1.8}

/* ============ 手机 ============ */
.mobstage{display:none;height:calc(100vh - 38px);background:#e6ebf3;align-items:center;justify-content:center;gap:26px}
.mobstage.show{display:flex}
.phone{width:390px;height:760px;background:#fff;border-radius:34px;box-shadow:0 30px 70px -24px rgba(15,23,42,.5),0 0 0 10px #0f172a;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:#0f172a;font-weight:600;flex-shrink:0}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:88px;height:20px;background:#0f172a;border-radius:99px;z-index:5}
.mtop{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;flex-shrink:0}
.mtop h1{font-size:17px;margin:0;letter-spacing:-.2px}
.mtop .spacer{flex:1}
.micon{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:#475569}
.micon svg{width:14px;height:14px}
.msearch{display:flex;align-items:center;gap:7px;margin:0 14px 8px;padding:0 10px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);color:#94a3b8;font-size:12px;flex-shrink:0}
.msearch svg{width:13px;height:13px}
.mchips{display:flex;gap:5px;padding:0 14px 8px;overflow-x:auto;flex-shrink:0}
.mchip{height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:11.5px;color:#475569;white-space:nowrap;flex-shrink:0}
.mchip.on{background:#0f172a;border-color:#0f172a;color:#fff;font-weight:600}
.mlist{flex:1;overflow-y:auto;padding:0 10px 12px}
.mgroup{font-size:10.5px;color:#94a3b8;font-weight:700;letter-spacing:.4px;padding:9px 6px 5px;display:flex;align-items:center;gap:6px}
.mgroup span{font-weight:400;letter-spacing:0}
.mrow{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:11px;background:#fff;border:1px solid transparent;margin-bottom:2px}
.mrow:active{background:var(--panel2)}
.mrow.on{background:var(--accent-soft);border-color:rgba(79,140,255,.35)}
.mrow .avatar{width:30px;height:30px;border-radius:9px;font-size:12px}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mt span{display:block;font-size:10.5px;color:#94a3b8;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.chev{color:#94a3b8;font-size:16px;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.running{background:var(--ok)}
.dot.stopped{background:#cbd5e1}
.dot.error{background:var(--danger)}
.dot.missing{background:#fff;border:1.5px dashed #cbd5e1}

.mtabbar{height:58px;display:flex;border-top:1px solid var(--border);background:#fff;flex-shrink:0;padding-bottom:4px}
.mtab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#94a3b8;font-size:10px}
.mtab.on{color:#1e40af}
.mtab svg{width:18px;height:18px}

/* 手机详情页 */
.mdetail{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;transform:translateX(100%);transition:.22s cubic-bezier(.3,.8,.3,1)}
.mdetail.show{transform:none}
.mback{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.mback button{width:30px;height:30px;border:0;background:transparent;font-size:20px;color:#334155;line-height:1}
.mback b{font-size:13.5px}
.mback .spacer{flex:1}
.mdb{flex:1;overflow-y:auto;padding:12px 12px 20px}
.mhero{background:#fff;border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:10px}
.mhero-top{display:flex;gap:10px;align-items:center}
.mhero .avatar{width:40px;height:40px;border-radius:11px;font-size:16px}
.mhero .nm2{font-size:15px;font-weight:700;line-height:1.3}
.mhero .sub2{font-size:10.5px;color:#94a3b8;font-family:var(--mono);margin-top:1px}
.mactions{display:flex;gap:6px;margin-top:11px}
.mactions .btn{flex:1;height:32px;font-size:12px}
.mkpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.msection{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden}
.msection .sec-b{padding:10px 12px}
.mterm{background:#0f172a;color:#cbd5e1;font-family:var(--mono);font-size:10.5px;line-height:1.6;padding:10px;max-height:200px;overflow:auto;white-space:pre-wrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#0f172a;color:#fff;font-size:12px;padding:9px 14px;border-radius:10px;opacity:0;transition:.18s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="proto-bar">
  <a href="index.html">← 方案总览</a>
  <span class="pb-sep"></span>
  <span class="pb-title">落地形态 · B + D 融合</span>
  <span class="pb-chip">表格即列表 · 检查器即详情</span>
  <span class="pb-chip">同一份数据，两种壳</span>
  <span class="spacer"></span>
  <div class="devtoggle" id="devtoggle">
    <button class="on" data-dev="desk">桌面</button>
    <button data-dev="mob">手机</button>
  </div>
  <label class="scale-wrap">规模
    <select id="scale">
      <option value="24">24 个</option>
      <option value="48" selected>48 个</option>
      <option value="120">120 个</option>
    </select>
  </label>
</div>

<!-- ================= 桌面 ================= -->
<div class="desk" id="desk">
  <nav class="iconrail">
    <span class="ir-logo">US</span>
    <button class="on" title="程序"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M2.5 6.5h11M6.5 6.5v7"/></svg></button>
    <button title="模板库"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.2l5.3 2.8L8 7.8 2.7 5z"/><path d="M2.7 8L8 10.8 13.3 8M2.7 11L8 13.8l5.3-2.8"/></svg></button>
    <button title="日志"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h10M3 12h6"/></svg></button>
    <span class="spacer"></span>
    <button title="设置"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg></button>
  </nav>

  <div class="work">
    <div class="wbar">
      <div class="wtitle">全部程序 <small id="d-sub">48 个 · 34 运行中</small></div>
      <span class="spacer"></span>
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
        <input id="dq" placeholder="搜索名称 / id / 端口…（/ 聚焦）" />
      </div>
      <button class="btn" id="d-density">紧凑</button>
      <button class="btn" id="d-inspect">检查器</button>
      <button class="btn primary" id="d-new">＋ 新建</button>
    </div>
    <div class="fbar" id="dfilters">
      <button class="fchip on" data-f="all">全部 <span class="n" id="dn-all">48</span></button>
      <button class="fchip" data-f="running">运行中 <span class="n" id="dn-run">34</span></button>
      <button class="fchip" data-f="error">异常 <span class="n" id="dn-err">2</span></button>
      <button class="fchip" data-f="update">有更新 <span class="n" id="dn-upd">8</span></button>
      <button class="fchip" data-f="native">系统调度 <span class="n" id="dn-sys">21</span></button>
      <span class="spacer"></span>
      <span class="hint">↑↓ 切换 · Enter 聚焦检查器 · Esc 收起</span>
    </div>
    <div class="bulkbar" id="dbulk">
      <b id="dbulk-n">已选 0 项</b>
      <button class="b" data-act="start">启动</button>
      <button class="b" data-act="stop">停止</button>

function build(n){
  let list=RAW.map((r,i)=>({id:r[0],name:r[1],cat:r[2],state:r[3],sup:r[4],ver:r[5],latest:r[6],port:r[7],auto:!!r[8],up:r[9],hue:TILE[i%TILE.length],mem:18+(i*7)%120}));
  if(n>list.length){
    const cats=[...new Set(RAW.map(r=>r[2]))];
    const states=['running','running','running','running','running','stopped','stopped','stopped','stopped','stopped','error','running'];
    for(let i=list.length;i<n;i++){
      const base=RAW[i%RAW.length],k=Math.floor(i/RAW.length);
      list.push({id:base[0]+'-w'+String(k).padStart(2,'0'),name:base[1]+' #'+k,cat:cats[i%cats.length],
        state:states[i%states.length],sup:i%3===0?'native':'managed',ver:base[5],
        latest:i%7===0?base[5].replace(/(\d+)$/,m=>+m+1):'',port:10000+(i*7)%40000,
        auto:i%2===0,up:i%3===0?'1d 3h':'',hue:TILE[i%TILE.length],mem:18+(i*11)%160});
    }
  }
  return list;
}

const COLS=[{k:'state',label:'状态',w:'88px'},{k:'name',label:'名称 / ID',w:'auto'},{k:'cat',label:'分类',w:'112px'},

const S={items:build(48),filter:'all',q:'',sel:'dufs',tab:'overview',dense:false,inspect:true,
  checked:new Set(),sortKey:'',sortDir:1,dev:'desk',mSelMode:false,mDetail:false,lastIdx:-1};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

};

function counts(){
  const it=S.items;
  return {all:it.length,running:it.filter(i=>i.state==='running').length,error:it.filter(i=>i.state==='error').length,
    update:it.filter(i=>i.latest&&i.latest!==i.ver).length,native:it.filter(i=>i.sup==='native').length};
}
function visible(){
  const q=S.q.trim().toLowerCase();
  let rows=S.items.filter(i=>{
    if(S.filter==='running'&&i.state!=='running') return false;
    if(S.filter==='error'&&i.state!=='error') return false;
    if(S.filter==='update'&&!(i.latest&&i.latest!==i.ver)) return false;
    if(S.filter==='native'&&i.sup!=='native') return false;
    if(q&&!(i.name+' '+i.id+' '+i.port+' '+i.cat).toLowerCase().includes(q)) return false;
    return true;
  });
  if(S.sortKey){
    const k=S.sortKey;
    rows=rows.slice().sort((a,b)=>{
      let x=a[k],y=b[k];
      if(k==='state'){const r={running:0,error:1,stopped:2,missing:3};x=r[x];y=r[y];}
      if(typeof x==='number'&&typeof y==='number') return (x-y)*S.sortDir;
      return String(x).localeCompare(String(y),'zh')*S.sortDir;
    });
  }
  return rows;
}
function cur(){ return S.items.find(i=>i.id===S.sel)||null; }

/* ---------- 桌面：表头 + 行 ---------- */
function renderHead(){
  const ths=[`<th class="cbcell"><input type="checkbox" id="dselall"></th>`];
  for(const c of COLS){
    const sorted=S.sortKey===c.k;
    ths.push(`<th class="sortable ${sorted?'sorted':''}" data-sort="${c.k}" style="width:${c.w}">${c.label}<span class="arrow">${sorted?(S.sortDir>0?'▲':'▼'):'↕'}</span></th>`);
  }
  $('#dhead').innerHTML=ths.join('');
}
function rowHTML(i){
  const upd=i.latest&&i.latest!==i.ver;
  return `<tr class="${i.id===S.sel?'on':''} ${S.checked.has(i.id)?'picked':''}" data-row="${i.id}">
    <td class="cbcell"><input type="checkbox" data-check="${i.id}" ${S.checked.has(i.id)?'checked':''}></td>
    <td><span class="pill ${i.state}"><i></i>${ST[i.state]}</span></td>
    <td><div class="cell-name"><span class="avatar" style="background:${i.hue}">${esc(i.name.slice(0,1).toUpperCase())}</span>
      <span><span class="nm">${esc(i.name)}</span><span class="nm-sub">${esc(i.id)}</span></span></div></td>
    <td><span class="cat"><i style="background:${CATC[i.cat]||'#94a3b8'}"></i>${esc(i.cat)}</span></td>
    <td><span class="ver">${i.ver?'v'+esc(i.ver):'—'}</span>${upd?`<span class="upbadge">↑ ${esc(i.latest)}</span>`:''}</td>
    <td><span class="port">${i.port?':'+i.port:'—'}</span></td>
    <td><span class="sup ${i.sup==='native'?'sys':''}">${i.sup==='native'?'系统':'壳托管'}</span></td>
    <td><span class="switch ${i.auto?'on':''}" data-auto="${i.id}"></span></td>
    <td><span class="uptime">${i.state==='running'?(i.up||'刚刚'):'—'}</span></td>
  </tr>`;
}

<span class="m">23:41:44</span> <span class="g">INFO</span> GET /index.html <span class="g">200</span> 3.2ms</div>

  }
  if(S.tab==='update'){
    body=`<div class="sec"><div class="sec-h">版本对比<span class="spacer"></span><span class="hint">通道 stable</span></div>
      <div class="sec-b"><dl class="kv">
        <dt>本地</dt><dd>v${esc(i.ver)}</dd>
        <dt>最新</dt><dd style="color:${upd?'#1d4ed8':'#334155'}">${i.latest?'v'+esc(i.latest):'—'}</dd>
        <dt>操作</dt><dd><span class="plain">${upd?'<button class="btn sm primary" data-i="upd">应用更新</button>':'已是最新'}</span></dd>
      </dl>${upd?'<div style="font-size:10.5px;color:#92400e;background:#fffbeb;border:1px solid rgba(217,119,6,.28);padding:6px 8px;border-radius:7px;margin-top:7px">更新保留已填字段，仅替换二进制并重启</div>':''}</div></div>`;
  }
  $('#ibody').innerHTML=body;
}

/* ---------- 手机 ---------- */
function renderMob(){
  const rows=visible();
  const groups=new Map();
  for(const i of rows){ if(!groups.has(i.cat)) groups.set(i.cat,[]); groups.get(i.cat).push(i); }
  let html='';
  for(const [cat,list] of groups){
    html+=`<div class="mgroup">${esc(cat)}<span>${list.length} 个</span></div>`;
    html+=list.map(i=>`<div class="mrow ${i.id===S.sel?'on':''}" data-mrow="${i.id}">
      ${S.mSelMode?`<input type="checkbox" data-mcheck="${i.id}" ${S.checked.has(i.id)?'checked':''}>`:''}
      <span class="avatar" style="background:${i.hue}">${esc(i.name.slice(0,1).toUpperCase())}</span>
      <div class="mt"><b>${esc(i.name)}</b><span>${i.port?':'+i.port+' · ':''}v${esc(i.ver)}${i.state==='running'&&i.up?' · '+i.up:''}</span></div>
      <div class="mr"><span class="dot ${i.state}"></span><span class="chev">›</span></div>
    </div>`).join('');
  }
  $('#mlist').innerHTML=html||'<div style="padding:30px;text-align:center;color:#94a3b8;font-size:12px">无匹配</div>';
  $('#m-select').textContent=S.mSelMode?'取消':'选择';
  $('#m-select').style.background=S.mSelMode?'#0f172a':'#fff';
  $('#m-select').style.color=S.mSelMode?'#fff':'#475569';
}

function renderMDetail(){
  const i=cur(); if(!i) return;
  $('#m-dtitle').textContent=i.name;
  const upd=i.latest&&i.latest!==i.ver;
  $('#mdb').innerHTML=`
    <div class="mhero">
      <div class="mhero-top">
        <span class="avatar" style="background:${i.hue}">${esc(i.name.slice(0,1).toUpperCase())}</span>
        <div style="flex:1;min-width:0"><div class="nm2">${esc(i.name)}</div><div class="sub2">${esc(i.id)} · v${esc(i.ver)}</div></div>
        <span class="pill ${i.state}"><i></i>${ST[i.state]}</span>
      </div>
      <div class="mactions">
        ${i.state==='running'?`<button class="btn" data-mi="stop">停止</button><button class="btn" data-mi="restart">重启</button>`
          :`<button class="btn primary" data-mi="start">启动</button>`}
        <button class="btn" data-mi="log">日志</button>
        <button class="btn" data-mi="open">打开</button>
      </div>
    </div>
    <div class="mkpis">
      <div class="kpi"><div class="k">运行时长</div><div class="v">${i.state==='running'?(i.up||'刚刚'):'—'}</div></div>
      <div class="kpi"><div class="k">监听端口</div><div class="v">${i.port||'—'}</div></div>
      <div class="kpi"><div class="k">调度归属</div><div class="v" style="font-size:12px">${i.sup==='native'?'系统调度':'壳托管'}</div></div>
      <div class="kpi"><div class="k">内存</div><div class="v">${i.state==='running'?i.mem:0}<small>MB</small></div></div>
    </div>
    <div class="msection"><div class="sec-h">配置<span class="spacer"></span><button class="btn sm" data-mi="edit">编辑</button></div>
      <div class="sec-b"><dl class="kv">
        <dt>分类</dt><dd><span class="plain">${esc(i.cat)}</span></dd>
        <dt>启动参数</dt><dd>--port ${i.port||'—'}</dd>
        <dt>工作目录</dt><dd>~/…/data/${esc(i.id)}</dd>
        <dt>开机自启</dt><dd><span class="plain">${i.auto?'已开启':'未开启'}</span></dd>
      </dl></div></div>
    ${upd?`<div class="msection"><div class="sec-h">更新<span class="spacer"></span><span class="hint">v${esc(i.ver)} → v${esc(i.latest)}</span></div>
      <div class="sec-b"><button class="btn primary" style="width:100%" data-mi="upd">应用更新</button></div></div>`:''}
    <div class="msection" style="margin-bottom:0"><div class="logbar"><b style="color:#e2e8f0">日志</b><span class="spacer"></span><button>跟随中</button></div>
      <div class="mterm"><span class="m">23:40:12</span> <span class="g">INFO</span> listening on :${i.port||5000}
<span class="m">23:41:44</span> <span class="g">INFO</span> GET / 200 2.1ms
<span class="m">23:42:10</span> <span class="r">ERROR</span> upstream timeout</div></div>`;
}

function renderAll(){
  renderHead();
  $('#dbody').innerHTML=visible().map(rowHTML).join('')||'<tr><td colspan="9" style="padding:40px;text-align:center;color:#94a3b8">没有匹配项</td></tr>';
  $('#dtbl').className=S.dense?'dense':'';
  const c=counts();
  $('#dn-all').textContent=c.all;$('#dn-run').textContent=c.running;$('#dn-err').textContent=c.error;
  $('#dn-upd').textContent=c.update;$('#dn-sys').textContent=c.native;
  $('#d-sub').textContent=c.all+' 个 · '+c.running+' 运行中';
  $('#dbulk').classList.toggle('show',S.checked.size>0);
  $('#dbulk-n').textContent='已选 '+S.checked.size+' 项';
  const rows=visible();
  const sa=$('#dselall');
  if(sa){ const all=rows.length&&rows.every(i=>S.checked.has(i.id)); const some=rows.some(i=>S.checked.has(i.id));
    sa.checked=all; sa.indeterminate=!all&&some; }
  renderInspect();
  renderMob();
  renderMDetail();
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}

/* ---------- 桌面事件 ---------- */
$('#dhead').addEventListener('click',e=>{
  const th=e.target.closest('[data-sort]'); if(!th) return;
  const k=th.dataset.sort; S.sortDir=S.sortKey===k?-S.sortDir:1; S.sortKey=k; renderAll();
});
$('#dbody').addEventListener('click',e=>{
  const sw=e.target.closest('[data-auto]');
  if(sw){ const i=S.items.find(x=>x.id===sw.dataset.auto); i.auto=!i.auto; renderAll(); toast(i.name+(i.auto?' 已开启自启':' 已关闭自启')); return; }
  const tr=e.target.closest('[data-row]');
  if(tr&&!e.target.closest('input')&&!e.target.closest('.switch')){
    const id=tr.dataset.row, rows=visible(), idx=rows.findIndex(i=>i.id===id);
    if(e.shiftKey&&S.lastIdx>=0){
      const [a,b]=[Math.min(S.lastIdx,idx),Math.max(S.lastIdx,idx)];
      for(let i=a;i<=b;i++) S.checked.add(rows[i].id);
    } else { S.sel=id; S.lastIdx=idx; S.inspect=true; $('#desk').classList.remove('noinspect'); }
    renderAll();
  }
});
$('#dbody').addEventListener('change',e=>{
  const cb=e.target.closest('[data-check]'); if(!cb) return;
  cb.checked?S.checked.add(cb.dataset.check):S.checked.delete(cb.dataset.check);
  renderAll();
});
$('#dfilters').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]'); if(!f) return;
  S.filter=f.dataset.f;
  document.querySelectorAll('#dfilters [data-f]').forEach(b=>b.classList.toggle('on',b===f));
  renderAll();
});
$('#dbulk').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='clear'){ S.checked.clear(); renderAll(); return; }
  if(a==='delete'){ toast('已删除 '+S.checked.size+' 项（示意）'); S.checked.clear(); renderAll(); return; }
  S.items.forEach(i=>{ if(!S.checked.has(i.id)) return;
    if(a==='start'){ i.state='running'; i.up='刚刚'; }
    if(a==='stop'){ i.state='stopped'; i.up=''; }
    if(a==='restart'){ i.state='running'; i.up='刚刚'; }
  });
  toast('已对 '+S.checked.size+' 项执行「'+({start:'启动',stop:'停止',restart:'重启',update:'检查更新'})[a]+'」');
  renderAll();
});
$('#ihead').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t){ S.tab=t.dataset.t; renderInspect(); return; }
  const b=e.target.closest('[data-i]');
  if(b){ actOn(S.sel,b.dataset.i); }
});
$('#ibody').addEventListener('click',e=>{
  const b=e.target.closest('[data-i]'); if(b) actOn(S.sel,b.dataset.i);
});
function actOn(id,a){
  const i=S.items.find(x=>x.id===id); if(!i) return;
  if(a==='start'){ i.state='running'; i.up='刚刚'; toast(i.name+' 已启动'); }
  if(a==='stop'){ i.state='stopped'; i.up=''; toast(i.name+' 已停止'); }
  if(a==='restart'){ i.state='running'; i.up='刚刚'; toast(i.name+' 已重启'); }
  if(a==='open'){ toast(i.port?'打开 http://127.0.0.1:'+i.port:'未绑定端口'); return; }
  if(a==='upd'){ i.ver=i.latest; toast(i.name+' 已更新到 v'+i.ver); }
  if(a==='log'){ S.tab='logs'; renderInspect(); return; }
  if(a==='edit'){ toast('打开编辑对话框'); return; }
  renderAll();
}
$('#dq').addEventListener('input',e=>{ S.q=e.target.value; renderAll(); });
$('#d-density').addEventListener('click',()=>{ S.dense=!S.dense; $('#d-density').textContent=S.dense?'标准':'紧凑'; renderAll(); });
$('#d-inspect').addEventListener('click',()=>{ S.inspect=!S.inspect; $('#desk').classList.toggle('noinspect',!S.inspect); });

/* ---------- 手机事件 ---------- */
$('#mchips').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]'); if(!f) return;
  S.filter=f.dataset.f;
  document.querySelectorAll('#mchips [data-f]').forEach(b=>b.classList.toggle('on',b===f));
  renderMob();
});
$('#mlist').addEventListener('click',e=>{
  if(S.mSelMode){
    const cb=e.target.closest('[data-mcheck]');
    if(cb){ cb.checked?S.checked.add(cb.dataset.mcheck):S.checked.delete(cb.dataset.mcheck); return; }
    const row=e.target.closest('[data-mrow]');
    if(row){ const id=row.dataset.mrow; S.checked.has(id)?S.checked.delete(id):S.checked.add(id); renderMob(); }
    return;
  }
  const row=e.target.closest('[data-mrow]');
  if(row){ S.sel=row.dataset.mrow; S.mDetail=true; renderMob(); renderMDetail(); $('#mdetail').classList.add('show'); }
});
$('#m-select').addEventListener('click',()=>{ S.mSelMode=!S.mSelMode; if(!S.mSelMode) S.checked.clear(); renderMob(); });
$('#m-back').addEventListener('click',()=>{ S.mDetail=false; $('#mdetail').classList.remove('show'); renderMob(); });
$('#mdb').addEventListener('click',e=>{ const b=e.target.closest('[data-mi]'); if(b) actOn(S.sel,b.dataset.mi); });

/* ---------- 全局 ---------- */
$('#devtoggle').addEventListener('click',e=>{
  const b=e.target.closest('[data-dev]'); if(!b) return;
  S.dev=b.dataset.dev;
  document.querySelectorAll('#devtoggle button').forEach(x=>x.classList.toggle('on',x===b));
  $('#desk').classList.toggle('hide',S.dev!=='desk');
  $('#mobstage').classList.toggle('show',S.dev==='mob');
});
$('#scale').addEventListener('change',e=>{ S.items=build(+e.target.value); S.checked.clear(); S.sel=S.items[0].id; renderAll(); toast('规模切换到 '+e.target.value+' 个'); });
$('#d-new').addEventListener('click',()=>toast('新建程序 / 手建服务'));

document.addEventListener('keydown',e=>{
  if(e.target.matches('input')) return;
  if(e.key==='/'){ e.preventDefault(); $('#dq').focus(); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const rows=visible(); const idx=rows.findIndex(i=>i.id===S.sel);
    const n=Math.max(0,Math.min(rows.length-1,idx+(e.key==='ArrowDown'?1:-1)));
    if(rows[n]){ S.sel=rows[n].id; S.lastIdx=n; renderAll(); document.querySelector('tr.on')?.scrollIntoView({block:'nearest'}); }
  }
  if(e.key==='Escape'){ S.checked.clear(); renderAll(); }
});

renderAll();
</script>
</body>
</html>
