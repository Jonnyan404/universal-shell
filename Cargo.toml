[workspace]
resolver = "2"
members = ["shared", "us-service", "app-tauri/src-tauri", "web-server", "app-cli"]
# app-egui 已归档：目录与 git 历史保留，但不再参与 workspace 构建、打包与 CI。
# 该目录自带空 [workspace] 表以便独立构建；如需复活：删掉那里的 [workspace] 表、
# 把它加回 members 并删掉这行 exclude，再恢复打包脚本/工作流里的 egui 段。
exclude = ["app-egui"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Universal Shell"]

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
time = { version = "0.3", features = ["local-offset", "formatting"] }