[workspace]
resolver = "2"
members = ["shared", "app-egui", "app-tauri/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Universal Shell"]

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
time = { version = "0.3", features = ["local-offset", "formatting"] }