[package]
name = "us-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Declarative local services: generate launchd / systemd / Task Scheduler configs and run them"

[lib]
name = "us_service"
path = "src/lib.rs"

[[bin]]
name = "us-svc"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
time = { workspace = true }
toml = "0.8"
# 写回配置时保留用户的注释与排列（纯序列化会全部丢掉）
toml_edit = "0.22"
anyhow = "1.0"

# 信号转发只在 unix 有意义（Windows 由计划任务 /End 结束整棵进程树）
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"
