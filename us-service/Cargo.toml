[package]
name = "us-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Declarative local services: generate launchd / systemd / Task Scheduler configs and run them"

[lib]
name = "us_service"
path = "src/lib.rs"

[[bin]]
name = "us-svc"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
time = { workspace = true }
toml = "0.8"
anyhow = "1.0"
