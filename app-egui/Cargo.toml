# ⚠️ 已归档（2026-11-17）：本包不再属于根 workspace（见根 Cargo.toml 的 exclude）。
# 为了让它仍能独立构建/验证，这里内联了原本从 workspace 继承的字段；
# 若要复活：删掉下面的空 [workspace] 表、把它加回根 members、恢复 version.workspace 等继承写法。
[workspace]

[package]
name = "app-egui"
version = "0.1.8"
edition = "2021"
license = "MIT"
authors = ["Universal Shell"]
description = "Universal shell (egui)"

[[bin]]
name = "universal-shell-egui"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
web-server = { path = "../web-server" }
serde_json = "1.0"
rust-i18n = "4"
sys-locale = "0.3"
# glow (OpenGL) 后端兼容性最好；wgpu 在无 GPU/远程环境会 Device lost 崩溃。
# 不启 default 的 wgpu，避免误用 wgpu 渲染器。
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "links"] }
egui = "0.36"
rfd = "0.17"
tray-icon = "0.24"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
dirs = "6.0"
